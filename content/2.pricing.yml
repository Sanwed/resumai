title: A plan for every need
description: Our plans are designed to meet the requirements of both recruiters and job seekers. Get the right plan that suits you.
seo:
  title: Pricing
  description: Choose the plan that's right for you.
navigation.icon: i-lucide-credit-card
faq:
  title: Frequently asked questions
  description: Everything you need to know about ResumAI pricing, tokens, and billing.
  items:
    - label: How does the token system work?
      content: ResumAI uses a token-based credit system. Each resume analysis consumes tokens based on the complexity of the document. You can top up your balance at any time, and unused tokens carry over between billing periods.
    - label: How can I cancel my subscription?
      content: You can cancel your subscription at any time from the Billing section in your profile settings. You'll retain access to your plan's features until the end of your current billing period, and any remaining tokens stay available.
    - label: Is my resume and candidate data secure?
      content: Yes. All uploaded resumes and job descriptions are encrypted in transit and at rest. We never sell your data or use it to train public AI models, and only trusted infrastructure providers process it on our behalf.
    - label: Can I switch plans later?
      content: Absolutely. You can upgrade or downgrade your plan at any time from the Billing Portal. Changes take effect immediately, and any price difference is prorated for the current billing cycle.
    - label: Do you offer refunds?
      content: We offer refunds on a case-by-case basis, generally within the first 14 days of a subscription if the platform hasn't been used significantly. Reach out to our support team to request one.
    - label: What happens if I run out of tokens?
      content: If your token balance runs low, you'll see a warning in your dashboard before starting a new analysis. You can purchase additional tokens instantly, or upgrade to a plan with a higher monthly allotment.
