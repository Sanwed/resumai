title: Analyze Candidates with [ResumAI]{class="text-primary"}
description: AI-powered resume screening for recruiters and job seekers. Instantly evaluate resumes, match candidates to job descriptions, identify strengths and weaknesses, and make smarter hiring decisions in minutes.
seo:
  title: AI Resume Screening & Job Matching
  description: Screen resumes with AI, match candidates to job descriptions, uncover strengths and skill gaps, and make faster, more confident hiring decisions.
hero:
  links:
    - label: Get started
      icon: i-lucide-arrow-right
      trailing: true
      to: /dashboard
      size: xl
sections:
  - title: AI-Powered Resume Analysis
    description: Create hiring projects, analyze resumes with AI, and receive detailed insights that help recruiters and candidates make better decisions.
    id: features
    orientation: horizontal
    image: /images/home/ai-powered-resume-analysis.png
    darkImage: /images/home/ai-powered-resume-analysis-dark.png
    features:
      - name: Project-Based Hiring
        description: Organize every hiring process into dedicated projects with job descriptions, candidate lists, and analysis history in one place.
        icon: i-lucide-folder-kanban

      - name: Comprehensive AI Reports
        description: Generate detailed resume analyses covering skills, experience, strengths, weaknesses, missing qualifications, and overall candidate fit.
        icon: i-lucide-file-search

      - name: Smart Candidate Matching
        description: Compare resumes against your job requirements and instantly receive compatibility scores with actionable hiring recommendations.
        icon: i-lucide-user-round-search
  - title: Designed for Recruiters & Job Seekers
    description: Whether you're building a stronger team or improving your career opportunities, ResumAI provides the insights you need to make confident decisions.
    orientation: horizontal
    reverse: true
    image: /images/home/recruiters-and-job-seekers.png
    darkImage: /images/home/recruiters-and-job-seekers-dark.png
    features:
      - name: Faster Resume Screening
        description: Save hours of manual review by automatically ranking candidates and highlighting the most qualified applicants first.
        icon: i-lucide-timer

      - name: Actionable Insights
        description: Understand exactly why a candidate matches a position with AI-generated summaries, recommendations, and interview focus points.
        icon: i-lucide-lightbulb

      - name: Track Every Analysis
        description: Keep every project, uploaded resume, and AI report organized so you can revisit and compare candidates at any time.
        icon: i-lucide-history
features:
  title: Everything You Need for Smarter Hiring
  description: Streamline your recruitment workflow with AI-powered tools that help you analyze resumes, compare candidates, and make confident hiring decisions.

  items:
    - title: AI Resume Analysis
      description: Generate comprehensive reports that evaluate skills, experience, strengths, weaknesses, and overall candidate suitability.
      icon: i-lucide-file-search

    - title: Job Match Scoring
      description: Compare every resume against your job description and receive an AI-powered compatibility score with detailed reasoning.
      icon: i-lucide-target

    - title: Project Organization
      description: Manage multiple hiring campaigns with dedicated projects, keeping resumes, analyses, and candidate progress organized.
      icon: i-lucide-folder-kanban

    - title: Candidate Insights
      description: Discover key strengths, potential risks, missing qualifications, and interview recommendations before scheduling interviews.
      icon: i-lucide-lightbulb

    - title: Fast & Secure
      description: Upload resumes securely, process them in minutes, and access your reports whenever you need them.
      icon: i-lucide-shield-check

    - title: Built for Recruiters & Job Seekers
      description: Whether you're hiring the best talent or improving your own resume, ResumAI delivers clear, actionable AI insights.
      icon: i-lucide-users
